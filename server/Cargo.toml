[package]
name = "aio-plugin-rbac-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aio-plugin-rbac-model = { path = "../model" }
az-plugin-process = { git = "https://github.com/org-aio/aio-platform.git", rev = "0325d0c699b49a8c046d472e5c86e392e5bef348" }
anyhow = "1.0.99"
axum = "0.8.6"
dill = "0.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
uuid = { version = "1.18.1", features = ["v4"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }

[lints]
workspace = true
