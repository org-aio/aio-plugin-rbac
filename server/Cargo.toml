[package]
name = "aio-plugin-rbac-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aio-plugin-identity-server = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "02cd1de9a3430e6428e7af1267501710fcba026b" }
aio-plugin-rbac-model = { path = "../model" }
anyhow = "1.0.99"
axum = "0.8.6"
dill = "0.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
